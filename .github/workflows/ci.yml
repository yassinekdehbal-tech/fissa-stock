name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci echoue si package.json et package-lock.json divergent :
      # c'est precisement le garde-fou qui manquait.
      - name: Install dependencies (lockfile strict)
        run: npm ci

      - name: Typecheck
        run: npx vue-tsc --noEmit

      - name: Build
        run: npm run build
