name: Build iOS & Deploy to TestFlight

# Prérequis côté compte Apple (voir STORES_GUIDE.md) — vérifiés par l'étape
# "Check Apple account" avant toute compilation :
#   - clé API App Store Connect avec le rôle ADMIN (cloud signing)
#   - App ID com.fissa.pieceauto enregistré
#   - fiche app créée dans App Store Connect
# Secrets GitHub : ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_CONTENT, APPLE_TEAM_ID

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Write API Key file
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          # Reconstruit un PEM valide meme si les retours a la ligne ont ete perdus au collage
          BODY=$(printf '%s' "$ASC_KEY_CONTENT" \
            | sed -e 's/-----BEGIN PRIVATE KEY-----//g' -e 's/-----END PRIVATE KEY-----//g' \
            | tr -d '[:space:]')
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s' "$BODY" | fold -w 64
            echo
            echo "-----END PRIVATE KEY-----"
          } > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "Cle ecrite, nombre de lignes:"
          wc -l < ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Check Apple account (fail fast with a clear message)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH=~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          node scripts/check-asc.mjs

      - name: Build web for Capacitor
        run: npm run build:native

      - name: Add iOS platform
        run: npx cap add ios

      - name: Generate icons & splash screens
        run: npm run assets:ios

      - name: Prepare native project (usage descriptions)
        run: node scripts/prepare-native.mjs ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Read app version
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Build archive
        run: |
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            MARKETING_VERSION=$APP_VERSION \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            -quiet

      - name: Create export options
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Export and upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      - name: Keep export logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-export-logs-${{ github.run_number }}
          path: |
            /var/folders/**/T/*.xcdistributionlogs/**
            ${{ runner.temp }}/export/**
          if-no-files-found: ignore
